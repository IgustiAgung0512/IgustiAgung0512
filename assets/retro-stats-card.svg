<svg fill="none" viewBox="0 0 850 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Orbitron:wght@500;700;900&amp;display=swap');
        
        .card {
          width: 100%;
          height: 260px;
          background: #08071a;
          background-image: 
            radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.25) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(0, 245, 255, 0.2) 0%, transparent 40%),
            linear-gradient(rgba(0, 245, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 245, 255, 0.04) 1px, transparent 1px);
          background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
          border-radius: 12px;
          border: 2px solid #00f5ff;
          box-shadow: 0 0 20px rgba(0, 245, 255, 0.35), inset 0 0 25px rgba(138, 43, 226, 0.2);
          box-sizing: border-box;
          padding: 20px 25px;
          color: #f8fafc;
          font-family: 'Orbitron', monospace;
          position: relative;
          overflow: hidden;
        }

        .header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px dashed rgba(0, 245, 255, 0.4);
          padding-bottom: 10px;
          margin-bottom: 15px;
        }

        .header-title {
          font-family: 'Press Start 2P', cursive;
          font-size: 12px;
          color: #00f5ff;
          text-shadow: 0 0 8px #00f5ff;
          letter-spacing: 1px;
        }

        .status-badge {
          background: rgba(34, 197, 94, 0.2);
          border: 1px solid #22c55e;
          color: #4ade80;
          font-size: 10px;
          padding: 3px 8px;
          border-radius: 4px;
          text-shadow: 0 0 6px #22c55e;
          font-family: 'Press Start 2P', cursive;
        }

        .grid-content {
          display: grid;
          grid-template-columns: 1.1fr 1fr;
          gap: 20px;
        }

        .info-col {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        .info-row {
          display: flex;
          align-items: center;
          font-size: 13px;
        }

        .label {
          color: #a78bfa;
          width: 140px;
          font-weight: 700;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .value {
          color: #e2e8f0;
          font-weight: 500;
        }

        .highlight-cyan {
          color: #00f5ff;
          text-shadow: 0 0 6px rgba(0, 245, 255, 0.6);
        }

        /* Stat Bars */
        .bars-col {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .bar-group {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        .bar-label {
          display: flex;
          justify-content: space-between;
          font-size: 11px;
          font-weight: 700;
          color: #cbd5e1;
        }

        .bar-container {
          height: 10px;
          background: rgba(15, 23, 42, 0.8);
          border: 1px solid rgba(255, 255, 255, 0.2);
          border-radius: 5px;
          overflow: hidden;
          position: relative;
        }

        .bar-fill {
          height: 100%;
          border-radius: 4px;
        }

        .fill-hp {
          width: 100%;
          background: linear-gradient(90deg, #ef4444, #f87171);
          box-shadow: 0 0 10px #ef4444;
        }

        .fill-mp {
          width: 95%;
          background: linear-gradient(90deg, #00f5ff, #38bdf8);
          box-shadow: 0 0 10px #00f5ff;
        }

        .fill-exp {
          width: 88%;
          background: linear-gradient(90deg, #8a2be2, #c084fc);
          box-shadow: 0 0 10px #8a2be2;
        }

        /* Scanline effect */
        .scanline {
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
          background-size: 100% 4px;
          pointer-events: none;
          opacity: 0.6;
        }
      </style>

      <div class="card">
        <div class="scanline"></div>
        <div class="header">
          <div class="header-title">👾 PLAYER_1 // COSMIC PILOT STATS</div>
          <div class="status-badge">● ONLINE</div>
        </div>

        <div class="grid-content">
          <div class="info-col">
            <div class="info-row">
              <span class="label">🧑‍🚀 PILOT:</span>
              <span class="value highlight-cyan">I Gusti Agung Ketut Agung</span>
            </div>
            <div class="info-row">
              <span class="label">🛸 CLASS:</span>
              <span class="value">Full-Stack Cosmic Architect</span>
            </div>
            <div class="info-row">
              <span class="label">🪐 HOME BASE:</span>
              <span class="value">Bogor • Padang • Bali (ID)</span>
            </div>
            <div class="info-row">
              <span class="label">🎯 MAIN QUEST:</span>
              <span class="value highlight-cyan">Building Galaxy-Scale Web Apps</span>
            </div>
            <div class="info-row">
              <span class="label">🕹️ GUILD:</span>
              <span class="value">Open Source &amp; Retro Hackers</span>
            </div>
          </div>

          <div class="bars-col">
            <div class="bar-group">
              <div class="bar-label">
                <span>❤️ HP (CODING STAMINA)</span>
                <span>999 / 999</span>
              </div>
              <div class="bar-container">
                <div class="bar-fill fill-hp"></div>
              </div>
            </div>

            <div class="bar-group">
              <div class="bar-label">
                <span>⚡ MP (COFFEE &amp; CREATIVITY)</span>
                <span>950 / 1000</span>
              </div>
              <div class="bar-container">
                <div class="bar-fill fill-mp"></div>
              </div>
            </div>

            <div class="bar-group">
              <div class="bar-label">
                <span>🌟 EXP (KNOWLEDGE PROGRESS)</span>
                <span>LVL 99 (88%)</span>
              </div>
              <div class="bar-container">
                <div class="bar-fill fill-exp"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
