<svg fill="none" viewBox="0 0 1000 320" width="100%" height="320" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .galaxy-container {
          position: relative;
          width: 100%;
          height: 320px;
          background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
          overflow: hidden;
          font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
          color: #fff;
          border-radius: 16px;
          box-shadow: 0 0 30px rgba(0, 245, 255, 0.2), inset 0 0 40px rgba(138, 43, 226, 0.3);
          border: 1px solid rgba(0, 245, 255, 0.3);
          box-sizing: border-box;
        }

        /* Nebula Clouds */
        .nebula {
          position: absolute;
          border-radius: 50%;
          filter: blur(50px);
          opacity: 0.45;
          animation: pulse-nebula 8s ease-in-out infinite alternate;
        }
        .nebula-1 {
          width: 400px;
          height: 250px;
          background: radial-gradient(circle, #8a2be2, transparent);
          top: -60px;
          left: 10%;
        }
        .nebula-2 {
          width: 350px;
          height: 220px;
          background: radial-gradient(circle, #00f5ff, transparent);
          bottom: -40px;
          right: 15%;
          animation-duration: 6s;
        }
        .nebula-3 {
          width: 300px;
          height: 180px;
          background: radial-gradient(circle, #ff007f, transparent);
          top: 40px;
          right: 35%;
          animation-duration: 10s;
        }

        @keyframes pulse-nebula {
          0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
          100% { transform: scale(1.15) translate(15px, -10px); opacity: 0.6; }
        }

        /* Stars */
        .star {
          position: absolute;
          background: #ffffff;
          border-radius: 50%;
          animation: twinkle var(--duration) ease-in-out infinite;
        }
        @keyframes twinkle {
          0%, 100% { opacity: 0.2; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.4); box-shadow: 0 0 8px #00f5ff; }
        }

        /* Shooting Star / Meteor */
        .shooting-star {
          position: absolute;
          top: 15%;
          left: 85%;
          width: 120px;
          height: 2px;
          background: linear-gradient(90deg, #00f5ff, transparent);
          transform: rotate(-35deg);
          animation: shoot 5s linear infinite;
          opacity: 0;
        }
        .shooting-star-2 {
          position: absolute;
          top: 40%;
          left: 95%;
          width: 90px;
          height: 2px;
          background: linear-gradient(90deg, #ff007f, transparent);
          transform: rotate(-35deg);
          animation: shoot 7s linear 2.5s infinite;
          opacity: 0;
        }

        @keyframes shoot {
          0% { transform: translateX(0) translateY(0) rotate(-35deg); opacity: 1; }
          30% { transform: translateX(-400px) translateY(280px) rotate(-35deg); opacity: 0; }
          100% { transform: translateX(-400px) translateY(280px) rotate(-35deg); opacity: 0; }
        }

        /* Grid lines for sci-fi HUD vibe */
        .grid-overlay {
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background-image: 
            linear-gradient(rgba(0, 245, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 245, 255, 0.05) 1px, transparent 1px);
          background-size: 30px 30px;
          pointer-events: none;
        }

        /* Planet */
        .planet {
          position: absolute;
          right: 50px;
          top: 35px;
          width: 90px;
          height: 90px;
          border-radius: 50%;
          background: linear-gradient(135deg, #a855f7 0%, #3b185f 70%, #090d2a 100%);
          box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 25px rgba(168, 85, 247, 0.4);
          animation: float-planet 6s ease-in-out infinite alternate;
        }
        .planet-ring {
          position: absolute;
          right: 30px;
          top: 65px;
          width: 130px;
          height: 30px;
          border: 3px solid rgba(0, 245, 255, 0.6);
          border-radius: 50%;
          transform: rotate(-25deg);
          box-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
          pointer-events: none;
        }

        @keyframes float-planet {
          0% { transform: translateY(0px) rotate(0deg); }
          100% { transform: translateY(-8px) rotate(5deg); }
        }

        /* Content */
        .content {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100%;
          text-align: center;
          padding: 0 20px;
        }

        .tagline {
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 4px;
          color: #00f5ff;
          text-transform: uppercase;
          text-shadow: 0 0 10px rgba(0, 245, 255, 0.8);
          margin-bottom: 8px;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .title {
          font-size: 34px;
          font-weight: 900;
          letter-spacing: 3px;
          background: linear-gradient(135deg, #ffffff 0%, #00f5ff 50%, #d946ef 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 18px rgba(0, 245, 255, 0.6));
          margin: 0 0 10px 0;
          text-transform: uppercase;
        }

        .sub-desc {
          font-size: 15px;
          font-weight: 500;
          color: #e2e8f0;
          letter-spacing: 2px;
          text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
          margin-bottom: 14px;
        }

        .badges-row {
          display: flex;
          gap: 12px;
          margin-top: 5px;
        }

        .badge-pill {
          background: rgba(15, 23, 42, 0.7);
          border: 1px solid rgba(0, 245, 255, 0.4);
          padding: 6px 14px;
          border-radius: 20px;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 1px;
          color: #f1f5f9;
          box-shadow: 0 0 10px rgba(0, 245, 255, 0.2);
          backdrop-filter: blur(5px);
        }
        .badge-pill span {
          color: #00f5ff;
        }
      </style>

      <div class="galaxy-container">
        <!-- Nebulas -->
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="nebula nebula-3"></div>

        <!-- Grid -->
        <div class="grid-overlay"></div>

        <!-- Shooting Stars -->
        <div class="shooting-star"></div>
        <div class="shooting-star-2"></div>

        <!-- Planet -->
        <div class="planet"></div>
        <div class="planet-ring"></div>

        <!-- Stars scattered -->
        <div class="star" style="top: 15%; left: 8%; width: 3px; height: 3px; --duration: 3s;"></div>
        <div class="star" style="top: 25%; left: 22%; width: 2px; height: 2px; --duration: 2.2s;"></div>
        <div class="star" style="top: 75%; left: 14%; width: 4px; height: 4px; --duration: 4s;"></div>
        <div class="star" style="top: 85%; left: 28%; width: 2px; height: 2px; --duration: 2.8s;"></div>
        <div class="star" style="top: 12%; left: 45%; width: 3px; height: 3px; --duration: 3.5s;"></div>
        <div class="star" style="top: 80%; left: 60%; width: 3px; height: 3px; --duration: 2.5s;"></div>
        <div class="star" style="top: 20%; left: 75%; width: 2px; height: 2px; --duration: 3.1s;"></div>
        <div class="star" style="top: 65%; left: 82%; width: 4px; height: 4px; --duration: 1.8s;"></div>
        <div class="star" style="top: 30%; left: 92%; width: 2px; height: 2px; --duration: 2.7s;"></div>
        <div class="star" style="top: 50%; left: 5%; width: 2px; height: 2px; --duration: 3.8s;"></div>
        <div class="star" style="top: 40%; left: 35%; width: 3px; height: 3px; --duration: 2.1s;"></div>
        <div class="star" style="top: 70%; left: 48%; width: 2px; height: 2px; --duration: 3.4s;"></div>

        <!-- Main Content -->
        <div class="content">
          <div class="tagline">
            <span>✨</span> TRANSMISSION // INTERSTELLAR COMMAND <span>✨</span>
          </div>
          <div class="title">I GUSTI AGUNG KETUT AGUNG</div>
          <div class="sub-desc">
            🛸 FULL-STACK VOYAGER &amp; SOFTWARE ARCHITECT 🪐
          </div>
          <div class="badges-row">
            <div class="badge-pill">🚀 <span>MISSION:</span> CODE THE UNIVERSE</div>
            <div class="badge-pill">👾 <span>LEVEL:</span> 99 FULL-STACK</div>
            <div class="badge-pill">🪐 <span>BASE:</span> BOGOR • PADANG • BALI</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
