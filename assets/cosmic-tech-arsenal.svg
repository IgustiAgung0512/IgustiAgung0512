<svg fill="none" viewBox="0 0 900 420" width="100%" height="420" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Share+Tech+Mono&amp;display=swap');

        .arsenal-box {
          width: 100%;
          height: 420px;
          background: #060515;
          background-image: 
            radial-gradient(circle at 80% 20%, rgba(217, 70, 239, 0.2) 0%, transparent 45%),
            radial-gradient(circle at 20% 80%, rgba(0, 245, 255, 0.2) 0%, transparent 45%),
            linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
          background-size: 100% 100%, 100% 100%, 25px 25px, 25px 25px;
          border-radius: 14px;
          border: 1px solid rgba(0, 245, 255, 0.4);
          box-shadow: 0 0 25px rgba(0, 245, 255, 0.25), inset 0 0 35px rgba(138, 43, 226, 0.2);
          box-sizing: border-box;
          padding: 20px 24px;
          font-family: 'Orbitron', monospace;
          color: #fff;
          position: relative;
          overflow: hidden;
        }

        .header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid rgba(0, 245, 255, 0.3);
          padding-bottom: 10px;
          margin-bottom: 18px;
        }

        .title {
          font-size: 14px;
          font-weight: 800;
          letter-spacing: 2px;
          color: #00f5ff;
          text-shadow: 0 0 10px rgba(0, 245, 255, 0.8);
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .sys-ver {
          font-family: 'Share Tech Mono', monospace;
          font-size: 11px;
          color: #c084fc;
          letter-spacing: 1px;
        }

        .section-group {
          margin-bottom: 14px;
        }

        .section-label {
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 1.5px;
          color: #f472b6;
          margin-bottom: 8px;
          display: flex;
          align-items: center;
          gap: 6px;
          text-transform: uppercase;
        }

        .badges-grid {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }

        .tech-pill {
          background: rgba(15, 23, 42, 0.85);
          border: 1px solid rgba(0, 245, 255, 0.3);
          border-radius: 6px;
          padding: 5px 12px;
          font-size: 11px;
          font-family: 'Share Tech Mono', monospace;
          font-weight: 600;
          color: #e2e8f0;
          display: flex;
          align-items: center;
          gap: 6px;
          box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
          transition: all 0.3s;
        }

        .tech-pill .dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #00f5ff;
          box-shadow: 0 0 6px #00f5ff;
        }

        .dot-purple { background: #c084fc !important; box-shadow: 0 0 6px #c084fc !important; }
        .dot-pink { background: #f472b6 !important; box-shadow: 0 0 6px #f472b6 !important; }
        .dot-green { background: #34d399 !important; box-shadow: 0 0 6px #34d399 !important; }
        .dot-amber { background: #fbbf24 !important; box-shadow: 0 0 6px #fbbf24 !important; }
      </style>

      <div class="arsenal-box">
        <div class="header">
          <div class="title">🛸 STARSHIP WEAPONS &amp; SUBSYSTEMS [TECH STACK]</div>
          <div class="sys-ver">CORE_ENGINE // READY</div>
        </div>

        <div class="section-group">
          <div class="section-label">⚡ PROPULSION &amp; USER INTERFACE (FRONTEND)</div>
          <div class="badges-grid">
            <div class="tech-pill"><span class="dot"></span>React.js</div>
            <div class="tech-pill"><span class="dot"></span>Next.js</div>
            <div class="tech-pill"><span class="dot"></span>TypeScript</div>
            <div class="tech-pill"><span class="dot"></span>JavaScript (ES6+)</div>
            <div class="tech-pill"><span class="dot"></span>TailwindCSS</div>
            <div class="tech-pill"><span class="dot"></span>Bootstrap</div>
            <div class="tech-pill"><span class="dot"></span>HTML5 / CSS3</div>
            <div class="tech-pill"><span class="dot"></span>Vite</div>
          </div>
        </div>

        <div class="section-group">
          <div class="section-label" style="color: #c084fc;">🛰️ MAIN REACTOR &amp; DATA HYPERDRIVE (BACKEND &amp; DB)</div>
          <div class="badges-grid">
            <div class="tech-pill"><span class="dot dot-purple"></span>Node.js</div>
            <div class="tech-pill"><span class="dot dot-purple"></span>Express.js</div>
            <div class="tech-pill"><span class="dot dot-purple"></span>PHP</div>
            <div class="tech-pill"><span class="dot dot-purple"></span>Laravel</div>
            <div class="tech-pill"><span class="dot dot-purple"></span>Python</div>
            <div class="tech-pill"><span class="dot dot-purple"></span>MySQL</div>
            <div class="tech-pill"><span class="dot dot-purple"></span>PostgreSQL</div>
            <div class="tech-pill"><span class="dot dot-purple"></span>MongoDB</div>
            <div class="tech-pill"><span class="dot dot-purple"></span>Supabase</div>
          </div>
        </div>

        <div class="section-group">
          <div class="section-label" style="color: #34d399;">🛠️ ORBITAL NAVIGATION &amp; FLIGHT CONTROL (TOOLS &amp; DEVOPS)</div>
          <div class="badges-grid">
            <div class="tech-pill"><span class="dot dot-green"></span>Git</div>
            <div class="tech-pill"><span class="dot dot-green"></span>GitHub</div>
            <div class="tech-pill"><span class="dot dot-green"></span>VS Code</div>
            <div class="tech-pill"><span class="dot dot-green"></span>Postman</div>
            <div class="tech-pill"><span class="dot dot-green"></span>Docker</div>
            <div class="tech-pill"><span class="dot dot-green"></span>Figma (UI/UX)</div>
            <div class="tech-pill"><span class="dot dot-green"></span>Linux</div>
            <div class="tech-pill"><span class="dot dot-green"></span>Vercel</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
