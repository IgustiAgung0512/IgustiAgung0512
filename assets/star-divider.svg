<svg fill="none" viewBox="0 0 800 40" width="100%" height="40" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .divider-container {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 15px;
          width: 100%;
          height: 40px;
        }
        .line {
          flex: 1;
          height: 2px;
          background: linear-gradient(90deg, transparent, #8a2be2, #00f5ff, transparent);
          box-shadow: 0 0 10px #00f5ff;
        }
        .line-reverse {
          flex: 1;
          height: 2px;
          background: linear-gradient(90deg, transparent, #00f5ff, #8a2be2, transparent);
          box-shadow: 0 0 10px #8a2be2;
        }
        .star-icon {
          font-size: 18px;
          filter: drop-shadow(0 0 8px #00f5ff);
          animation: spin-glow 4s linear infinite;
        }
        @keyframes spin-glow {
          0% { transform: rotate(0deg) scale(1); }
          50% { transform: rotate(180deg) scale(1.2); }
          100% { transform: rotate(360deg) scale(1); }
        }
      </style>
      <div class="divider-container">
        <div class="line"></div>
        <div class="star-icon">✨ 🪐 ✨</div>
        <div class="line-reverse"></div>
      </div>
    </div>
  </foreignObject>
</svg>
