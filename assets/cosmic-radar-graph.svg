<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Share+Tech+Mono&amp;display=swap');

        .radar-box {
          width: 100%;
          height: 240px;
          background: #060515;
          background-image: 
            radial-gradient(circle at 20% 50%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 80% 50%, rgba(138, 43, 226, 0.2) 0%, transparent 50%);
          border-radius: 14px;
          border: 1px solid #00f5ff;
          box-shadow: 0 0 25px rgba(0, 245, 255, 0.25), inset 0 0 30px rgba(138, 43, 226, 0.2);
          box-sizing: border-box;
          padding: 16px 24px;
          font-family: 'Orbitron', monospace;
          color: #fff;
          position: relative;
          overflow: hidden;
        }

        .top-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 12px;
          border-bottom: 1px solid rgba(0, 245, 255, 0.3);
          padding-bottom: 6px;
        }

        .title {
          font-size: 12px;
          font-weight: 800;
          letter-spacing: 2px;
          color: #00f5ff;
          text-shadow: 0 0 8px #00f5ff;
        }

        .telemetry-status {
          font-family: 'Share Tech Mono', monospace;
          font-size: 11px;
          color: #4ade80;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .pulse-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #22c55e;
          box-shadow: 0 0 8px #22c55e;
          animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 0.4; transform: scale(0.9); }
          50% { opacity: 1; transform: scale(1.3); }
        }

        .chart-svg {
          width: 100%;
          height: 140px;
        }

        .days-row {
          display: flex;
          justify-content: space-between;
          padding: 0 20px;
          font-family: 'Share Tech Mono', monospace;
          font-size: 11px;
          color: #94a3b8;
          letter-spacing: 1px;
        }
      </style>

      <div class="radar-box">
        <div class="top-row">
          <div class="title">🌌 COSMIC RADAR // COMMIT FREQUENCY FREQ_0512</div>
          <div class="telemetry-status">
            <span class="pulse-dot"></span> ORBITAL FREQUENCY: ACTIVE
          </div>
        </div>

        <!-- SVG Radar Wave Graph -->
        <svg class="chart-svg" viewBox="0 0 850 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="waveGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.45"/>
              <stop offset="50%" stop-color="#8a2be2" stop-opacity="0.2"/>
              <stop offset="100%" stop-color="#060515" stop-opacity="0.0"/>
            </linearGradient>
            <linearGradient id="lineStroke" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#00f5ff"/>
              <stop offset="50%" stop-color="#c084fc"/>
              <stop offset="100%" stop-color="#f472b6"/>
            </linearGradient>
          </defs>

          <!-- Grid Lines -->
          <line x1="20" y1="20" x2="830" y2="20" stroke="rgba(0,245,255,0.1)" stroke-dasharray="4 4" />
          <line x1="20" y1="55" x2="830" y2="55" stroke="rgba(0,245,255,0.1)" stroke-dasharray="4 4" />
          <line x1="20" y1="90" x2="830" y2="90" stroke="rgba(0,245,255,0.1)" stroke-dasharray="4 4" />
          <line x1="20" y1="125" x2="830" y2="125" stroke="rgba(0,245,255,0.2)" />

          <!-- Filled Area Under Curve -->
          <path d="M 30,110 Q 150,20 280,60 T 520,30 T 720,40 T 820,80 L 820,125 L 30,125 Z" fill="url(#waveGradient)" />

          <!-- Neon Curve Line -->
          <path d="M 30,110 Q 150,20 280,60 T 520,30 T 720,40 T 820,80" fill="none" stroke="url(#lineStroke)" stroke-width="3" style="filter: drop-shadow(0 0 6px #00f5ff);" />

          <!-- Starship Coordinate Nodes -->
          <circle cx="30" cy="110" r="4" fill="#00f5ff" stroke="#fff" stroke-width="1.5" style="filter: drop-shadow(0 0 5px #00f5ff);" />
          <circle cx="160" cy="35" r="5" fill="#c084fc" stroke="#fff" stroke-width="1.5" style="filter: drop-shadow(0 0 8px #c084fc);" />
          <circle cx="280" cy="60" r="4" fill="#00f5ff" stroke="#fff" stroke-width="1.5" />
          <circle cx="410" cy="45" r="4" fill="#f472b6" stroke="#fff" stroke-width="1.5" />
          <circle cx="520" cy="30" r="6" fill="#00f5ff" stroke="#fff" stroke-width="2" style="filter: drop-shadow(0 0 10px #00f5ff);" />
          <circle cx="630" cy="55" r="4" fill="#c084fc" stroke="#fff" stroke-width="1.5" />
          <circle cx="720" cy="40" r="5" fill="#f472b6" stroke="#fff" stroke-width="1.5" style="filter: drop-shadow(0 0 8px #f472b6);" />
          <circle cx="820" cy="80" r="4" fill="#00f5ff" stroke="#fff" stroke-width="1.5" />
        </svg>

        <div class="days-row">
          <span>MON // 01</span>
          <span>TUE // 02</span>
          <span>WED // 03</span>
          <span>THU // 04</span>
          <span>FRI // 05 (PEAK WARP)</span>
          <span>SAT // 06</span>
          <span>SUN // 07</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
