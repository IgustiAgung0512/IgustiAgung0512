<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Share+Tech+Mono&amp;display=swap');

        .stats-wrapper {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
          width: 100%;
          height: 240px;
          font-family: 'Orbitron', monospace;
          color: #fff;
          box-sizing: border-box;
        }

        .stat-card {
          background: #060515;
          background-image: 
            radial-gradient(circle at 80% 20%, rgba(138, 43, 226, 0.2) 0%, transparent 50%),
            linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
          background-size: 100% 100%, 20px 20px, 20px 20px;
          border-radius: 12px;
          border: 1px solid #00f5ff;
          box-shadow: 0 0 20px rgba(0, 245, 255, 0.2), inset 0 0 25px rgba(138, 43, 226, 0.15);
          box-sizing: border-box;
          padding: 16px 20px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          position: relative;
          overflow: hidden;
        }

        .card-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid rgba(0, 245, 255, 0.3);
          padding-bottom: 8px;
        }

        .card-title {
          font-size: 11px;
          font-weight: 800;
          letter-spacing: 1.5px;
          color: #00f5ff;
          text-shadow: 0 0 8px #00f5ff;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .rank-badge {
          background: linear-gradient(135deg, #ffd700, #ff8c00);
          color: #000;
          font-weight: 900;
          font-size: 10px;
          padding: 2px 8px;
          border-radius: 4px;
          box-shadow: 0 0 8px #ffd700;
        }

        .metrics-list {
          display: flex;
          flex-direction: column;
          gap: 8px;
          margin: 6px 0;
        }

        .metric-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 12px;
          font-family: 'Share Tech Mono', monospace;
        }

        .metric-label {
          color: #cbd5e1;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .metric-value {
          color: #00f5ff;
          font-weight: 700;
          text-shadow: 0 0 6px rgba(0, 245, 255, 0.6);
        }

        /* Lang Bars */
        .lang-group {
          display: flex;
          flex-direction: column;
          gap: 3px;
        }

        .lang-info {
          display: flex;
          justify-content: space-between;
          font-size: 11px;
          font-family: 'Share Tech Mono', monospace;
          color: #e2e8f0;
        }

        .lang-track {
          height: 7px;
          background: rgba(15, 23, 42, 0.8);
          border: 1px solid rgba(255, 255, 255, 0.15);
          border-radius: 4px;
          overflow: hidden;
        }

        .lang-fill {
          height: 100%;
          border-radius: 3px;
        }
      </style>

      <div class="stats-wrapper">
        <!-- Left: Starfleet Telemetry -->
        <div class="stat-card">
          <div class="card-header">
            <div class="card-title">📊 STARFLEET TELEMETRY STATS</div>
            <div class="rank-badge">GRADE: S+</div>
          </div>

          <div class="metrics-list">
            <div class="metric-row">
              <span class="metric-label">⭐ Total Stars &amp; Trophies</span>
              <span class="metric-value">Master Level</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">🚀 Public Missions (Repos)</span>
              <span class="metric-value">Active &amp; Growing</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">🪐 Code Transmissions (Commits)</span>
              <span class="metric-value">Continuous Sync</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">⚡ System Reliability</span>
              <span class="metric-value" style="color: #4ade80;">99.98% OPTIMAL</span>
            </div>
          </div>

          <div style="font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #94a3b8; border-top: 1px dashed rgba(0,245,255,0.2); padding-top: 5px;">
            🛰️ Status: Hyperdrive Engine Full Throttle
          </div>
        </div>

        <!-- Right: Linguistic Hyperdrive -->
        <div class="stat-card">
          <div class="card-header">
            <div class="card-title">🛸 LINGUISTIC HYPERDRIVE (LANGS)</div>
            <div style="font-size: 10px; color: #c084fc; font-weight: 700;">TOP CORE</div>
          </div>

          <div class="metrics-list" style="gap: 7px;">
            <div class="lang-group">
              <div class="lang-info">
                <span>⚡ JavaScript / TypeScript</span>
                <span style="color: #f7df1e;">45%</span>
              </div>
              <div class="lang-track">
                <div class="lang-fill" style="width: 45%; background: #f7df1e; box-shadow: 0 0 8px #f7df1e;"></div>
              </div>
            </div>

            <div class="lang-group">
              <div class="lang-info">
                <span>🛰️ PHP / Laravel / Backend</span>
                <span style="color: #c084fc;">30%</span>
              </div>
              <div class="lang-track">
                <div class="lang-fill" style="width: 30%; background: #c084fc; box-shadow: 0 0 8px #c084fc;"></div>
              </div>
            </div>

            <div class="lang-group">
              <div class="lang-info">
                <span>🪐 HTML5 / CSS3 / Tailwind</span>
                <span style="color: #00f5ff;">25%</span>
              </div>
              <div class="lang-track">
                <div class="lang-fill" style="width: 25%; background: #00f5ff; box-shadow: 0 0 8px #00f5ff;"></div>
              </div>
            </div>
          </div>

          <div style="font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #94a3b8; border-top: 1px dashed rgba(0,245,255,0.2); padding-top: 5px;">
            🌌 Stack: Full-Stack Polyglot Navigator
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
